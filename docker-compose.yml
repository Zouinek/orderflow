services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orderflow      # created on first start
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
    ports:
      - "5432:5432"                  # exposed so you can also poke it with a DB client
    volumes:
      - postgres-data:/var/lib/postgresql   # data survives `docker compose down`
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orderflow", "-d", "orderflow"]
      interval: 5s
      timeout: 5s
      retries: 10


  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres          # service name = hostname on the compose network
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres-data:
