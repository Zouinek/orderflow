# Static analysis (SAST): finds injection, unsafe deserialization, etc. in our own code.
# Results show up under Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 6 * * 1"   # weekly, catches new queries on unchanged code

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # no Maven build needed: analyzes the source directly
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
