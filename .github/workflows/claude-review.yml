# AI code review on every PR. Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`).
name: Claude review

on:
  pull_request:
    types: [ opened, synchronize, ready_for_review ]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR. OrderFlow is an event-driven order/payment system
            (Spring Boot, Kafka, Postgres, Kubernetes). Focus on:
            - correctness bugs and failure modes (retries, duplicates, ordering, partial failure)
            - security issues (input validation, secrets, injection)
            - Kubernetes manifests: probes, resources, least privilege
            Skip style nitpicks. Only comment on real problems, and explain why each matters.

            Use `gh pr comment` for a summary and inline comments for specific lines.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
