spring.application.name=orderflow-api


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orderflow}
spring.datasource.username=${DB_USER:orderflow}
spring.datasource.password=${DB_PASSWORD:orderflow}

# Schema is owned by Flyway (db/migration). Hibernate only validates that the
# entity matches on startup: tables, columns and types, not constraints or nullability.
spring.jpa.hibernate.ddl-auto=validate

# Expose /actuator/health  this becomes your K8s readiness/liveness probe in A4
management.endpoints.web.exposure.include=health

# More details for specific problem
spring.mvc.problemdetails.enabled=true