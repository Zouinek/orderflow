spring.application.name=orderflow-api

# ${VAR:default} — reads the env var, falls back to the default.
# Local run: hits MySQL on localhost. In Docker/K8s: compose/YAML injects DB_HOST.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orderflow}
spring.datasource.username=${DB_USER:orderflow}
spring.datasource.password=${DB_PASSWORD:orderflow}

# Hibernate creates/updates the "orders" table from the @Entity on startup.
# Fine for learning; real projects use migrations (Flyway/Liquibase) instead.
spring.jpa.hibernate.ddl-auto=update

# Expose /actuator/health — this becomes your K8s readiness/liveness probe in A4
management.endpoints.web.exposure.include=health
