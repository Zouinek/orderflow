apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpass # dev-only; fine for local learning
            - name: MYSQL_DATABASE
              value: orderflow # creates the DB your app expects
            - name: MYSQL_USER
              value: orderflow # creates a user...
            - name: MYSQL_PASSWORD
              value: orderflow # ...with this password
          ports:
            - containerPort: 3306
          # NOTE: no volume = data is EPHEMERAL (lost if the pod restarts).
          # Fine for learning. Real DBs use a StatefulSet + PersistentVolume (later phase).
---
apiVersion: v1
kind: Service
metadata:
  name: mysql # <-- THIS name is the DNS name your app connects to
spec:
  selector:
    app: mysql # routes to the pod labeled app: mysql
  ports:
    - port: 3306
      targetPort: 3306
